name: Release Obsidian plugin

# manifest.json 의 version 과 같은 태그(예: 0.7.0)를 push 하면
# 빌드한 main.js / manifest.json / styles.css / versions.json 을 첨부한 GitHub Release 를 만든다.
# BRAT 가 이 Release 에서 플러그인을 내려받는다.
#
# 0.7.0 부터 빌드 단계가 있다 — 원본은 src/, main.js 는 여기서 esbuild 로 만든다(저장소에 없다).
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "태그($tag)와 manifest.json 의 version($manifest)이 다릅니다." >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build & test plugin
        run: |
          npm ci
          npm test
          npm run build
          npm run smoke

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css versions.json
